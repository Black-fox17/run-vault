[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runvault"
version = "0.1.0"
description = "Lightweight, reproducible machine learning experiment management, artifact persistence, and execution platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "RunVault Contributors" }
]
keywords = ["machine-learning", "experiment-tracking", "checkpoints", "pytorch", "reproducibility"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Framework integrations (Phase 3)
torch = [
    "torch>=2.0.0",
]

# Storage integrations (Phase 2 & Phase 3)
gdrive = [
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
]

# Development & engineering tooling
dev = [
    "hatchling>=1.20.0",
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["runvault"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["runvault", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (commented-out code)
    "PL",    # Pylint
    "RUF",   # Ruff-specific rules
]
ignore = [
    "PLR0913", # Too many arguments in function definition
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLR2004", # Magic value used in comparison
]
"runvault/__init__.py" = [
    "PLC0415", # Lazy deferred import for optional subpackages
]
"runvault/integrations/*" = [
    "PLC0415", # Optional dependency isolation inside accessor functions
]

[tool.ruff.lint.isort]
known-first-party = ["runvault"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["runvault", "tests"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
