name: Publish Python Distribution to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "pypi"
        type: choice
        options:
          - "pypi"
          - "testpypi"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Verify Quality & Build Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies with all extras
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev,torch,gdrive]"

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Type check with Pyright (strict mode)
        run: uv run pyright

      - name: Run test suite
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [check-and-build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'pypi' }}
      url: ${{ (github.event.inputs.environment == 'testpypi') && 'https://test.pypi.org/p/runvault-ai' || 'https://pypi.org/p/runvault-ai' }}
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event.inputs.environment == 'testpypi') && 'https://test.pypi.org/legacy/' || '' }}
          packages-dir: dist/
          verbose: true
